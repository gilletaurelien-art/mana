<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANA.bzh — Promenades & découvertes en Bretagne</title>
    <meta name="description" content="Promenades bretonnes hors ligne : GPS et sécurité sur le littoral, audio-guide du patrimoine, export GPX. MANAradio au centre — la voix du territoire." />
    <meta property="og:site_name" content="MANA.bzh" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MANA.bzh — Promenades & découvertes en Bretagne" />
    <meta property="og:description" content="Promenades bretonnes hors ligne : GPS et sécurité sur le littoral, audio-guide du patrimoine, export GPX. MANAradio au centre." />
    <meta name="theme-color" content="#1b2a4a" />
    <!-- 🔴 LE MANIFESTE N'EST PAS POSÉ ICI — il est ajouté plus bas, et
         SEULEMENT sur mana.bzh. Voir la raison au script.
         ⭐ L'icône, elle, reste statique et vaut pour les deux hôtes : une
            icône n'installe rien, elle nomme l'onglet de NOS pages. Sous
            `app/`, qui est à nous des deux côtés par le préfixe du bloc
            Caddy — à la racine, mana.love rendait sa coquille (26 008 o de
            HTML) et le favicon était mort.
         ATTENTION : ne pas écrire la forme étoilée du préfixe dans ce
         fichier. Les gardes qui le relisent retirent d'abord les commentaires
         de CODE, et cette séquence ouvre un commentaire qui avale la ligne
         suivante — la balise d'à côté disparaissait du texte examiné. -->
    <link rel="icon" href="%BASE_URL%app/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* ⚠️ AVANT REACT. `useLayoutEffect` supprime le flash entre deux rendus,
         mais pas celui du tout premier cadre : entre le HTML servi et le
         montage de React, la racine n'a aucun attribut et la colonne se peint
         en sable. Trois lignes ici valent mieux qu'un écran blanc au
         lancement — c'est le premier regard de quelqu'un sur l'application.
         ⭐ La règle est la MÊME que dans App.tsx. Deux copies, donc : à
            changer ensemble. Un test les compare. */
      (function () {
        /* ⚠️ LE PRÉFIXE VIENT DE VITE, il ne s'écrit pas ici. `%BASE_URL%`
           vaut « /mana/ » sur GitHub Pages et « / » à la racine d'un
           domaine ; `slice(b.length - 1)` retire le préfixe dans les deux
           cas, et rend « / » quand il ne reste rien. */
        var b = "%BASE_URL%";
        var p = location.pathname.slice(b.length - 1) || "/";
        document.documentElement.dataset.fond =
          (p === "/" || /\/en-chemin\/?$/.test(p)) ? "immersif" : "lecture";

        /* 🔴 LE MANIFESTE SEULEMENT SUR mana.bzh — 7/11/2026, trouvé par une
           relecture adversariale AVANT déploiement, et c'était un défaut
           bloquant.
           ⛔ Un manifeste est un fichier STATIQUE : il est servi aux deux
              hôtes, octet pour octet. Son `start_url` vaut la racine du site.
              Sur mana.love la racine appartient à l'AUTRE application —
              installer « MANA — Promenades » depuis mana.love/promenades
              aurait donc créé une icône qui ouvre SA page d'accueil. Rien
              n'échoue : l'application s'installe, elle se lance, et elle
              lance autre chose.
           ⭐ ET LA BONNE RÉPONSE N'EST PAS DE BRICOLER LE `start_url`. Sur
              mana.love nous sommes un INVITÉ : deux écrans dans le site de
              quelqu'un d'autre. Un invité ne propose pas d'installer la
              maison. L'application installable de ce domaine est la sienne.
           ⚠️ Posé en JS et non en HTML parce qu'un seul fichier sert les deux
              hôtes. C'est avant tout chargement et avant toute invite
              d'installation — la seule chose qu'un `<link rel="manifest">`
              déclenche plus tard. */
        if (location.hostname !== "mana.love") {
          var m = document.createElement("link");
          m.rel = "manifest";
          m.href = b + "app/manifest.webmanifest";
          document.head.appendChild(m);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
