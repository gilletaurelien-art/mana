name: Preview design

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Les runners GitHub ont les libs système que la sandbox n'a pas :
      # le rendu headless devient possible ici.
      - run: npm i --no-save playwright-core
      - run: npx playwright-core install --with-deps chromium

      - name: Capture desktop + mobile
        run: |
          cat > shot.mjs <<'EOF'
          import { chromium } from "playwright-core";
          import { cwd } from "process";
          const browser = await chromium.launch();
          const url = "file://" + cwd() + "/site/index.html";
          const d = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await d.goto(url); await d.waitForTimeout(500);
          await d.screenshot({ path: "preview-desktop.png", fullPage: true });
          const m = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await m.goto(url); await m.waitForTimeout(500);
          await m.screenshot({ path: "preview-mobile.png", fullPage: true });
          await browser.close();
          console.log("captures ok");
          EOF
          node shot.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: preview-design
          path: preview-*.png
          retention-days: 30
