name: Deploy live

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Pages attend un dossier unique ; on pousse le build Vite complet
      - run: mv site _page

      # Hack liens profonds : 404.html = copie d'index ; le JS lit l'URL
      # et rend la bonne page. Toujours dans le workflow, jamais en local.
      - run: cp _page/index.html _page/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _page

      - uses: actions/deploy-pages@v4
        id: deployment
