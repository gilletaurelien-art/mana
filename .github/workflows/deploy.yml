name: Deploy live

on:
  push:
    branches: [main]
  # 🔴 DÉCLENCHEUR MANUEL — 4/11/2026, après une soirée perdue à ça.
  #    GitHub Pages a eu un hoquet : le build a réussi, l'artefact est monté,
  #    et `deploy-pages` a expiré en attendant « updating_pages ». Rien de
  #    notre côté à corriger — il fallait juste relancer.
  # ⛔ ET « RELANCER » N'EXISTAIT PAS. Sans `workflow_dispatch`, le seul
  #    déclencheur est un push : relancer l'exécution ÉCHOUÉE refait l'étape
  #    de build, qui dépose un SECOND artefact `github-pages` — et
  #    `deploy-pages` refuse alors d'en trouver deux (« Artifact count is
  #    2 »). La reprise ne répare donc pas la panne, elle en ajoute une.
  # ⭐ Le seul recours restant était un commit VIDE, dans un dépôt dont les
  #    messages de commit sont la documentation. Une infrastructure dont le
  #    rattrapage impose de salir l'historique n'a pas de rattrapage.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Pages attend un dossier unique ; on pousse le build Vite complet
      - run: mv site _page

      # Hack liens profonds : 404.html = copie d'index ; le JS lit l'URL
      # et rend la bonne page. Toujours dans le workflow, jamais en local.
      - run: cp _page/index.html _page/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _page

      - uses: actions/deploy-pages@v4
        id: deployment
