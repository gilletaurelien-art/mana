<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANA.bzh — Promenades & découvertes en Bretagne</title>
    <meta name="description" content="Promenades bretonnes hors ligne : GPS et sécurité sur le littoral, audio-guide du patrimoine, export GPX. MANAradio au centre — la voix du territoire." />
    <meta property="og:site_name" content="MANA.bzh" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MANA.bzh — Promenades & découvertes en Bretagne" />
    <meta property="og:description" content="Promenades bretonnes hors ligne : GPS et sécurité sur le littoral, audio-guide du patrimoine, export GPX. MANAradio au centre." />
    <meta name="theme-color" content="#1b2a4a" />
    <!-- 🔴 SOUS `app/`, PAS À LA RACINE — 7/11/2026. Sur mana.love la racine
         appartient à l'autre application : `/manifest.webmanifest` y rendait sa
         coquille (26 008 o de HTML) et le navigateur refusait le manifeste.
         ⭐ `app/` est DÉJÀ à nous sur les deux hôtes, par le préfixe des chemins `app/` du
            bloc Caddy : la réparation tient en un chemin, sans faire voyager un
            fichier entre deux blocs de serveur ni toucher à celui d'en face.
         ATTENTION : ne pas écrire la forme étoilée du préfixe dans ce
         fichier. Les gardes qui le relisent retirent d'abord les commentaires
         de CODE, et cette séquence ouvre un commentaire qui avale la ligne
         suivante — la balise d'à côté disparaissait du texte examiné. -->
    <link rel="manifest" href="%BASE_URL%app/manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%app/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* ⚠️ AVANT REACT. `useLayoutEffect` supprime le flash entre deux rendus,
         mais pas celui du tout premier cadre : entre le HTML servi et le
         montage de React, la racine n'a aucun attribut et la colonne se peint
         en sable. Trois lignes ici valent mieux qu'un écran blanc au
         lancement — c'est le premier regard de quelqu'un sur l'application.
         ⭐ La règle est la MÊME que dans App.tsx. Deux copies, donc : à
            changer ensemble. Un test les compare. */
      (function () {
        /* ⚠️ LE PRÉFIXE VIENT DE VITE, il ne s'écrit pas ici. `%BASE_URL%`
           vaut « /mana/ » sur GitHub Pages et « / » à la racine d'un
           domaine ; `slice(b.length - 1)` retire le préfixe dans les deux
           cas, et rend « / » quand il ne reste rien. */
        var b = "%BASE_URL%";
        var p = location.pathname.slice(b.length - 1) || "/";
        document.documentElement.dataset.fond =
          (p === "/" || /\/en-chemin\/?$/.test(p)) ? "immersif" : "lecture";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
